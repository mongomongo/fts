<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='color-scheme' content='dark'><title>FTS Running Order</title><style>
:root{--bg:#0f1319;--card:#171c24;--ink:#e8ecf1;--muted:#9aa6b2;--line:#242c36;
--accent:#4c8dff;--chip:#1e2530;--badge:#16263e;--badgeink:#8fbaff;}
*{box-sizing:border-box}html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);
font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
-webkit-text-size-adjust:100%;padding:0 0 40px}
.wrap{max-width:680px;margin:0 auto;padding:16px}
header h1{font-size:19px;margin:0 0 2px}
header .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.group{margin:22px 0 8px}
.group h2{font-size:16px;margin:0 0 2px;display:flex;align-items:baseline;gap:8px}
.group h2 .count{color:var(--muted);font-weight:500;font-size:13px}
.daterow{color:var(--muted);font-size:12px;text-transform:uppercase;
letter-spacing:.04em;margin:14px 2px 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
padding:11px 13px;margin:8px 0;display:flex;gap:12px;align-items:flex-start}
.time{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;
background:var(--chip);border-radius:8px;padding:4px 8px;white-space:nowrap;min-width:56px;text-align:center}
.body{flex:1;min-width:0}
.fixture{font-weight:600}
.league{color:var(--muted);font-size:12.5px;margin-top:1px}
.sel{margin-top:6px}
.badge{display:inline-block;background:var(--badge);color:var(--badgeink);
border-radius:6px;padding:2px 7px;font-size:12.5px;font-weight:600}
.meta{color:var(--muted);font-size:12px;margin-top:4px}
.empty{color:var(--muted);font-style:italic;padding:6px 2px}
footer{color:var(--muted);font-size:11.5px;margin-top:26px;text-align:center}

.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:9px 0 10px;
margin-bottom:2px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;
gap:8px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;
font-size:13px;font-weight:600;padding:6px 12px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.barinfo{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted)}
.barinfo b{color:var(--ink)}
#refresh{border:1px solid var(--line);background:var(--card);color:var(--ink);
border-radius:8px;padding:5px 10px;font:inherit;font-size:14px;line-height:1;cursor:pointer}
.toprow{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.status{white-space:nowrap;font-size:12px;color:var(--muted)}
.live{color:#e5484d;font-weight:700;margin-right:2px}
.live .dot{display:inline-block;width:7px;height:7px;border-radius:50%;
background:#e5484d;margin-right:4px;vertical-align:middle;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.card[data-st='fin']{opacity:.45}
.card[data-st='live']{border-color:rgba(229,72,77,.45);box-shadow:0 0 0 1px rgba(229,72,77,.2)}
.liveempty{color:var(--muted);font-style:italic;padding:20px 2px;text-align:center}
.score{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);margin-right:2px}
.card[data-st='live'] .score{color:#e5484d}
.score .ft{color:var(--muted);font-weight:600;font-size:11px;margin-left:4px}
.score .mn{color:#e5484d;font-weight:600;font-size:11px;margin-left:4px}
.htn{color:var(--muted);font-weight:600;font-size:11px;margin-left:6px}
.goals{margin-top:6px;font-size:12px;color:var(--muted);line-height:1.45}
.goals .dash{opacity:.45;padding:0 7px}
/* bet price + placed status (from bets.json, your own Betfair orders) */
.bet{display:inline-block;margin-left:7px;border-radius:6px;padding:1px 7px;
font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;vertical-align:middle}
.bet[data-st='matched'],.bet[data-st='partial']{background:#0f2e1b;color:#4ac26b}
.bet[data-st='pending']{background:#33280f;color:#e0b64a}
.bet[data-st='settled']{background:var(--chip);color:var(--muted)}
.bet .q{opacity:.7;font-weight:600;margin-left:3px}
.card[data-bet='matched'],.card[data-bet='partial']{border-left:3px solid #2da44e}
.card[data-bet='pending']{border-left:3px solid #d4a72c}
</style></head><body><div class='wrap'><header><h1>FTS Running Order</h1><div class='sub'>1 selection(s) &middot; generated Tue 08 Sep 2026, 02:09</div></header><div class='bar'><div class='seg'><button data-view='left' class='on'>Left to play</button><button data-view='all'>All</button></div><div class='barinfo'><span id='counts'>&mdash;</span><span id='clock'></span><button id='refresh' title='Refresh now'>&#8635;</button></div></div><section class='group'><h2>Bets <span class='count'>1</span></h2><div class='dateblock' data-day='today'><div class='card' data-ko='1788822000000' data-fx='2026-09-08|vitoriaba|gremiors' data-sel='2026-09-08|vitoriaba|gremiors|overunder35goals|2|LAY' data-day='today'><div class='time'>00:00</div><div class='body'><div class='toprow'><span class='fixture'>Vitoria BA v Gremio RS</span><span class='status'><span class='score' hidden></span><span class='live' hidden><span class='dot'></span>LIVE</span><span class='when'></span></span></div><div class='league'>Brazilian Serie A</div><div class='sel'><span class='badge'>Brazil O3.5 · LAY O3.5</span><span class='bet' hidden></span></div><div class='meta'>stake £50 &middot; odds 4.5</div><div class='goals' hidden></div></div></div></div></section><div id='liveempty' class='liveempty' hidden>Nothing left to play &mdash; today&rsquo;s selections are all done.</div><footer>FTS &middot; live running order &middot; updates when you open or refresh</footer><script>window.__SCORES_URL="https://api.github.com/repos/mongomongo/fts/contents/scores.json?ref=scores";window.__BETS_URL=(window.__SCORES_URL||'').replace('scores.json','bets.json');</script><script>
(function(){
  var INPLAY_MS = 130*60*1000;   // a match counts as 'in play' ~130 min after KO
  var view = 'left';
  var cards = [].slice.call(document.querySelectorAll('.card'));
  var SCORES = {};               // fx_key -> {h,a,st,min}
  var BETS = {};                 // betkey -> {side,st,price,size,profit}
  function nowMs(){
    try{ var p = new URLSearchParams(location.search).get('now');
      if(p){ var n = parseInt(p,10); if(!isNaN(n)) return n; } }catch(e){}
    return Date.now();
  }
  function rel(ms){ var m=Math.round(ms/60000);
    if(m<1) return 'now'; if(m<60) return 'in '+m+'m';
    var h=Math.floor(m/60), mm=m%60; return 'in '+h+'h'+(mm?(' '+mm+'m'):''); }
  function two(n){ return (n<10?'0':'')+n; }
  function timeSt(now,ko){ return now<ko?'up':(now<ko+INPLAY_MS?'live':'fin'); }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function fmtGoal(x){ var s=(x.m||'')+"' "+esc(x.p||'?');
    if(x.k==='p') s+=' (pen)'; else if(x.k==='o') s+=' (og)'; return s; }

  // Pull scores.json (published by the VM poller). Handles the GitHub contents
  // API shape (base64 in .content) and a plain {scores:{...}} file.
  function fetchScores(){
    var url = window.__SCORES_URL;
    if(!url) return Promise.resolve();
    var u = url + (url.indexOf('?')>=0?'&':'?') + 't=' + Date.now();
    return fetch(u, {headers:{'Accept':'application/vnd.github+json'}})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if(!d) return;
        if(d.scores){ SCORES = d.scores || {}; return; }
        if(typeof d.content === 'string'){
          var b64 = d.content.replace(/\s/g,''), text;
          try{ text = new TextDecoder().decode(
                 Uint8Array.from(atob(b64), function(ch){ return ch.charCodeAt(0); })); }
          catch(e){ text = atob(b64); }
          var o = JSON.parse(text); SCORES = o.scores || {};
        }
      }).catch(function(){});
  }
  // Pull bets.json (your own Betfair matched prices + placed status), same
  // GitHub contents-API shape as scores.json, from the same branch.
  function fetchBets(){
    var url = window.__BETS_URL;
    if(!url) return Promise.resolve();
    var u = url + (url.indexOf('?')>=0?'&':'?') + 't=' + Date.now();
    return fetch(u, {headers:{'Accept':'application/vnd.github+json'}})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if(!d) return;
        if(d.bets){ BETS = d.bets || {}; return; }
        if(typeof d.content === 'string'){
          var b64 = d.content.replace(/\s/g,''), text;
          try{ text = new TextDecoder().decode(
                 Uint8Array.from(atob(b64), function(ch){ return ch.charCodeAt(0); })); }
          catch(e){ text = atob(b64); }
          var o = JSON.parse(text); BETS = o.bets || {};
        }
      }).catch(function(){});
  }
  function refresh(){ return Promise.all([fetchScores(), fetchBets()]).then(render); }

  function render(){
    var now=nowMs(), left=0, live=0, tmr=0;
    cards.forEach(function(c){
      var ko=parseInt(c.getAttribute('data-ko'),10)||0;
      var day=c.getAttribute('data-day');
      var st=timeSt(now,ko);
      var sc=SCORES[c.getAttribute('data-fx')];
      var scoreEl=c.querySelector('.score'), lb=c.querySelector('.live'),
          when=c.querySelector('.when'), goalsEl=c.querySelector('.goals');
      var showScore=false;
      if(sc){
        if(sc.st==='ft'||sc.st==='aet'||sc.st==='pen'||sc.st==='off') st='fin';
        else if(sc.st==='live'||sc.st==='ht') st='live';
        if(sc.st && sc.st!=='ns' && sc.st!=='off' && sc.h!=null && sc.a!=null){
          var tag = sc.st==='ft'  ? "<span class='ft'>FT</span>"
                  : sc.st==='aet' ? "<span class='ft'>AET</span>"
                  : sc.st==='pen' ? "<span class='ft'>PEN</span>"
                  : sc.st==='ht'  ? "<span class='mn'>HT</span>"
                  : (sc.min ? "<span class='mn'>"+sc.min+"'</span>" : "<span class='mn'>LIVE</span>");
          var htn = (sc.hth!=null && sc.st!=='ht')
                  ? " <span class='htn'>HT "+sc.hth+"–"+sc.hta+"</span>" : "";
          if(scoreEl){ scoreEl.innerHTML = sc.h+"–"+sc.a+tag+htn; showScore=true; }
        }
      }
      if(scoreEl) scoreEl.hidden=!showScore;
      if(goalsEl){
        if(sc && sc.g && sc.g.length){
          var hg=sc.g.filter(function(x){return x.t==='H';}).map(fmtGoal).join(', ');
          var ag=sc.g.filter(function(x){return x.t==='A';}).map(fmtGoal).join(', ');
          goalsEl.innerHTML="⚽ "+(hg||"")+"<span class='dash'>—</span>"+(ag||"");
          goalsEl.hidden=false;
        } else goalsEl.hidden=true;
      }
      // bet overlay: your own matched price + placed status on this selection
      var bk=c.getAttribute('data-sel'), bet=bk?BETS[bk]:null,
          betEl=c.querySelector('.bet');
      if(betEl){
        if(bet && bet.price!=null){
          var q = bet.st==='pending' ? "<span class='q'>?</span>"
                : bet.st==='partial' ? "<span class='q'>part</span>" : "";
          betEl.innerHTML=esc((bet.side||'')+' @ '+bet.price)+q;
          betEl.setAttribute('data-st', bet.st||'');
          c.setAttribute('data-bet', bet.st||''); betEl.hidden=false;
        } else { betEl.hidden=true; c.removeAttribute('data-bet'); }
      }
      c.setAttribute('data-st', st);
      if(showScore){ if(lb) lb.hidden=true; if(when) when.textContent=''; }
      else if(st==='live'){ if(lb) lb.hidden=false;
        if(when) when.textContent=Math.max(0,Math.round((now-ko)/60000))+"'"; }
      else { if(lb) lb.hidden=true; if(when) when.textContent=(st==='up')?rel(ko-now):''; }
      c.hidden = (view==='all') ? false : (st==='fin');
      if(st!=='fin'){ left++; if(st==='live') live++; if(day==='tomorrow') tmr++; }
    });
    [].forEach.call(document.querySelectorAll('.dateblock'), function(b){
      b.hidden = b.querySelectorAll('.card:not([hidden])').length===0; });
    [].forEach.call(document.querySelectorAll('section.group'), function(s){
      var v=s.querySelectorAll('.card:not([hidden])').length;
      s.hidden=v===0; var cn=s.querySelector('.count'); if(cn) cn.textContent=v; });
    var d=new Date(now), clk=document.getElementById('clock');
    if(clk) clk.textContent='as of '+two(d.getHours())+':'+two(d.getMinutes());
    var cnt=document.getElementById('counts');
    if(cnt){ if(view==='left'){ var td=left-tmr;
        cnt.innerHTML='<b>'+td+'</b> left today'+(live?(' · <b>'+live+'</b> live'):'')
                      +(tmr?(' · '+tmr+' tomorrow'):''); }
      else cnt.innerHTML='<b>'+cards.length+'</b> total'; }
    var em=document.getElementById('liveempty'); if(em) em.hidden=!(view==='left'&&left===0);
  }
  [].forEach.call(document.querySelectorAll('.seg button'), function(b){
    b.onclick=function(){ view=b.getAttribute('data-view');
      [].forEach.call(document.querySelectorAll('.seg button'), function(x){ x.classList.toggle('on', x===b); });
      render(); }; });
  var rf=document.getElementById('refresh'); if(rf) rf.onclick=refresh;
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) refresh(); });
  setInterval(render, 30000);      // time labels tick
  setInterval(refresh, 120000);    // re-pull scores (stays under API rate limits)
  refresh();                       // initial: fetch scores then render
})();
</script></div></body></html>
